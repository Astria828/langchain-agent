[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "loreweave-backend"
version = "0.1.0"
description = "织境 LoreWeave 本地 FastAPI 后端"
requires-python = ">=3.11,<3.15"
dependencies = [
    "alembic>=1.14,<2.0",
    "chromadb>=1.5,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "langchain-core>=1.4,<2.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.10,<3.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["*.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["../tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
